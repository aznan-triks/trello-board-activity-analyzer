name: Validation UI et fonctionnelle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL à tester — vide = serveur local ; renseignée = vérification du site publié"
        required: false
        default: ''
        type: string
permissions:
  contents: read
  pages: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: ${{ inputs.base_url || '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-navigateur
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  production-tests:
    name: Vérification du site publié
    # Publication automatique après un merge sur main, ou relance manuelle en
    # fournissant l'URL à contrôler (Actions → Run workflow → base_url).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != '')
    needs: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://aznan-triks.github.io/trello-board-activity-analyzer/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la publication Pages (arborescence, HTTP, SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-deployment.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exécuter les 18 scénarios contre le site public
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7
